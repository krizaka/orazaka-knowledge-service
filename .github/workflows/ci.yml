# Builds and tests orazaka-knowledge-service inside the Orazaka workspace (every upstream repository is
# built from source at its default branch), then publishes to GitHub Packages on a v* tag.
# The verification is the org's reusable java-ci.yml (krizaka/.github docs/standards/ci-and-deploy.md): the changes gate, the
# Maven cache, the timeout and the gate that always reports live there. The publication stays in krizaka/orazaka
# (component.yml), on a v* tag only, with the write permissions only that job holds.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    permissions:
      contents: read
    uses: krizaka/.github/.github/workflows/java-ci.yml@cf1e598a446ed2d4d98b98a67ec9795c0f80100d # v1.5.2
    with:
      workspace-component: orazaka-knowledge-service
      rewrite: true

  # The required check is « component / verify » (the job of the former shared pipeline): kept by a shim that reads the gate's verdict.
  required-check:
    name: component / verify
    needs: ci
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      RESULT: ${{ needs.ci.outputs.result }}
    steps:
      - run: test "$RESULT" = success

  publish:
    needs: ci
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: read
      packages: write
      # The shared component pipeline publishes npm packages with provenance (OIDC): a reusable
      # workflow cannot be granted more than its caller holds, so its absence fails at startup.
      id-token: write
    uses: krizaka/orazaka/.github/workflows/component.yml@7811f56c86053a9dfd68cd871d8e7102c9b527bb # main
    with:
      component: orazaka-knowledge-service
    secrets: inherit # zizmor: ignore[secrets-inherit] the org's own pinned pipeline; it reads SONAR_TOKEN and nothing else of the repository's secrets
